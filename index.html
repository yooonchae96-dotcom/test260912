<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 10px 0; color: #666; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 200px; font-size: 15px; }
    .memo button { float: right; }
    /* AI 코멘트 영역 */
    #aiArea { margin: 16px 0; }
    #aiBtn { padding: 8px 16px; background-color: #4A90E2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    #aiBtn:hover { background-color: #357ABD; }
    #aiBtn:disabled { background-color: #ccc; cursor: not-allowed; }
    #aiFeedback { margin-top: 10px; padding: 12px; background: #eef7ff; border-left: 4px solid #4A90E2; border-radius: 4px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>

  <!-- 백엔드 1 시간에 저장 기능을 붙이면 이 안내문은 지웁니다 -->

  <!-- 백엔드 2 시간에 여기에 로그인 버튼과 내 이름이 들어옵니다 -->
  <div id="userArea">로딩 중...</div>

  <!-- AI 피드백 버튼 및 결과 표시 영역 -->
  <div id="aiArea">
    <button id="aiBtn">🤖 AI 담벼락 총평/코멘트 듣기</button>
    <div id="aiFeedback"></div>
  </div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
